<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Find</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="img/localfind.ico">
    <script src="script.js"></script>
</head>
<body>
    <header>
        <img src="img/localfind.png" alt="logo">
        <div>
            <nav>
                <a onclick="cep()"><b>Pesquisar pelo Cep</b></a>
                <a onclick="endereco()"><b>Pesquisar pelo endereço</b></a>
            </nav>
        </div>
    </header>
    <section class="hero" id="hero">
            <h1 id="Titulo">
        Buscar por CEP
            </h1>
            <br>
        <div class="dados" id="dados">
            <div class="cep ativo" id="cep">
                <input type="text" placeholder="CEP" id="input_cep" class="input_cep" >
                <div class="botoes">
                    <button onclick="buscar_cep()" class="busca_cep" id="busca_cep"><b>Buscar Endereco</b></button>
                    <br>
                    <button onclick="limpa_cep()" class="limpa_cep" id="limpa_cep"><b>Limpar dados</b></button>
                </div>
                
            </div>
             <div class="endereco" id="endereco">
                <!-- Recomendado: maxlength 2 para garantir que digitem a sigla da UF -->
                <input type="text" placeholder="UF (ex: SP)" id="input_UF" maxlength="2" class="input_UF"> 
                <input type="text" placeholder="Cidade" id="input_cidade" class="input_cidade"> 
                <input type="text" placeholder="Logradouro" id="input_logradouro" class="input_logradouro"> 
                <button onclick="buscar_endereco()" class="busca_endereco" id="busca_endereco"><b>Buscar Endereço</b></button>
                <button onclick="limpa_endereco()" class="limpa_cep" id="limpa_endereco"><b>Limpar</b></button>
            </div>
        </div>
        <br>
        <div class="historico_resultado">
            <div class="resultado" id="resultado">
                <h4>Resultado</h4>
                <div class="dados_resultado" id="dados_resultado">
                    <br>
                <p id="logradouro"></p>
                <p id="bairro"></p>
                <p id="cidade"></p>
                <p id="estado"></p>
                </div>
            </div>
            <div class="historico" id="historico">
               <h4>Histórico</h4>
                <div class="dados_historico" id="dados_historico">
                         <br>
                </div>
            </div>
        </div>
         
    </section>

  
</body>
</html>
